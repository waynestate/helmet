# HELMET's pipeline, built from the Preflight components on this GitLab.
# Every include is pinned to one Preflight release, 0.5.0. Never use ~latest.
# HELMET requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit:
# from Preflight 0.3.0 each component pulls image_prefix/image, and image_prefix defaults to
# the group's proxy, so the image inputs below are plain image names. Put the prefix in the
# image as well and you are wearing a helmet on a helmet: the pull fails.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.5.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.5.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # It blocks (the component's default): a failing check fails the pipeline.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.5.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
  # Secret scanning: Gitleaks over the checked-out tree, through Preflight's component
  # (first released in 0.2.0). It fails the pipeline on a finding; --redact
  # keeps the secret itself out of the log and the gitleaks.json artifact.
  # Same image and digest as the component default; the prefix sends it through the proxy.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/secret-detection@0.5.0
    inputs:
      image: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  # Accessibility: the front page and every docs page, WCAG 2.2 AA, light and
  # dark, at 320 px (with the reflow check) and 1280 px: a step stricter than
  # scripts/a11y.sh (axe-core 4.14, 320 px), in Preflight's pinned Playwright
  # image (mcr.microsoft.com is not on the Dependency Proxy, which only fronts
  # Docker Hub, so a11y has no image_prefix).
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.5.0
    inputs:
      site_dir: site
      pages: ["index.html", "docs/**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

# WayneUI strict copies: PROCTOR runs on the project root so it sees site/assets/wayne-ui/.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
# These two jobs are HELMET's own, not Preflight components, so they name the proxy themselves.
wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

browser-headers-json:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - mkdir -p build
    - php tools/a11y/corp-headers.php > build/helmet-headers.json
  artifacts:
    paths: [build/helmet-headers.json]
    expire_in: 1 day

# Runs the H13 CORP opt-in check and the COEP readiness check in real
# Chromium, in the same Playwright image as the a11y component. It stays
# untagged.
browser-headers:
  needs: [browser-headers-json]
  image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
  script:
    - npm --prefix tools/a11y ci --no-audit --no-fund
    - node tools/a11y/corp-check.mjs --headers=build/helmet-headers.json
    - node tools/a11y/coep-check.mjs --headers=build/helmet-headers.json
